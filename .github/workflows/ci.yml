name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台矩阵：Windows 本地实测 + macOS/Linux 由 CI 自动验证
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm 版本由根 package.json 的 packageManager 字段决定（避免双指定冲突）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r run build
      - name: Test
        # 无 AGNES_API_KEY 时，真实 API 用例自动跳过（describe.runIf）
        run: pnpm -r run test
      - name: Stdio smoke (no key, graceful degradation)
        run: node stdio-smoke.mjs
        working-directory: packages/server
